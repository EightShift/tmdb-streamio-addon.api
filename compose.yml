services:
  tmdb-streamio-addon:
    image: tmdb-streamio-addon:latest
    container_name: tmdb-streamio-addon
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in your environment or .env file}
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_URL: ${PUBLIC_URL:-}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
      API_KEYS_ENABLED: ${API_KEYS_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      API_KEYS_FILE: ${API_KEYS_FILE:-}
    volumes:
      - tmdb-streamio-addon-cache:/app/cache
      - ./secrets:/app/secrets:ro

volumes:
  tmdb-streamio-addon-cache:
